[project]
name = "verdict-api"
version = "1.0.0"
description = "API de classification d'intention d'avis clients : positif, negatif, neutre."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "fastembed>=0.5",
    "qdrant-client>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "requests>=2.32",
]

[tool.uv]
package = false
